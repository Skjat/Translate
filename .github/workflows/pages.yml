name: Лента и публикация

on:
  push:
  schedule:
    - cron: "23 4 * * *" # каждый день в 04:23 UTC (07:23 МСК)
  workflow_dispatch:
    inputs:
      query:
        description: "Необязательно: найти статьи по запросу (например, «эффективность тренировок»)"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    name: Найти свежие статьи
    if: github.event_name != 'push' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - name: Нет ключа Claude — лента не обновляется
        if: env.HAS_KEY != 'true'
        run: |
          msg="Добавьте секрет ANTHROPIC_API_KEY: Settings → Secrets and variables → Actions → New repository secret. Без него свежие статьи в общую ленту не добавляются."
          echo "::warning title=Лента не обновлена::$msg"
          echo "### ⚠️ Лента не обновлена" >> "$GITHUB_STEP_SUMMARY"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v5
        if: env.HAS_KEY == 'true'
      - uses: actions/setup-node@v5
        if: env.HAS_KEY == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: env.HAS_KEY == 'true'
      - name: Обновить data/articles.json через Claude
        if: env.HAS_KEY == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          ARTICLES_PER_RUN: ${{ vars.ARTICLES_PER_RUN }}
          TOPICS_PER_RUN: ${{ vars.TOPICS_PER_RUN }}
          DISCOVER_QUERY: ${{ github.event.inputs.query }}
        run: node scripts/refresh-articles.mjs
      - run: node scripts/check.mjs
        if: env.HAS_KEY == 'true'
      - name: Сохранить изменения
        if: env.HAS_KEY == 'true'
        run: |
          if git diff --quiet -- data/articles.json; then
            echo "Лента не изменилась"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/articles.json
          git commit -m "Лента: свежие статьи $(date -u +%Y-%m-%d)"
          git push

  publish:
    name: Опубликовать сайт
    needs: refresh
    if: always() && needs.refresh.result != 'failure' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.pages.outputs.mode }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }} # свежий коммит после обновления ленты
      - name: Собрать сайт
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js .nojekyll css js data icons vendor _site/
      - name: Узнать, как настроен GitHub Pages
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -s -o pages.json -w "%{http_code}" -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/pages")
          type=$(jq -r '.build_type // empty' pages.json 2>/dev/null || true)
          echo "Pages API: $code, build_type: ${type:-—}"
          # В настройках выбрано «GitHub Actions» — публикует следующее задание; иначе — ветка gh-pages.
          if [ "$code" = "200" ] && [ "$type" = "workflow" ]; then
            echo "mode=actions" >> "$GITHUB_OUTPUT"
          else
            echo "mode=branch" >> "$GITHUB_OUTPUT"
          fi
          if [ "$code" != "200" ]; then
            msg="Сайт выложен в ветку gh-pages, но GitHub Pages не включён (ответ API: $code). Откройте Settings → Pages и выберите источник: ветка gh-pages или «GitHub Actions»."
            echo "::warning title=Сайт не опубликован::$msg"
            echo "### ⚠️ Сайт не опубликован" >> "$GITHUB_STEP_SUMMARY"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Выложить в ветку gh-pages
        if: steps.pages.outputs.mode == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Сайт из ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" gh-pages
          echo "Опубликовано: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" >> "$GITHUB_STEP_SUMMARY"

  deploy-actions:
    name: Опубликовать через GitHub Actions
    needs: publish
    if: always() && needs.publish.outputs.mode == 'actions'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - name: Собрать сайт
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js .nojekyll css js data icons vendor _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
