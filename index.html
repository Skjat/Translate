<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Кругозор</title>
  <meta name="description" content="Подборка качественных статей для расширения кругозора: наука, история, технологии, культура. Перевод по тапу и разговор с Claude.">
  <meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121316" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Кругозор">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
  <link rel="modulepreload" href="vendor/anthropic-sdk.js">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="app">
    <main id="view" tabindex="-1">
      <div class="boot">Загружаю ленту…</div>
    </main>
    <nav class="tabbar" aria-label="Разделы">
      <button data-tab="feed" class="active"><span class="tab-icon">📰</span><span>Лента</span></button>
      <button data-tab="random"><span class="tab-icon">🎲</span><span>Случайное</span></button>
      <button data-tab="saved"><span class="tab-icon">★</span><span>Моё</span></button>
      <button data-tab="settings"><span class="tab-icon">⚙︎</span><span>Настройки</span></button>
    </nav>
  </div>
  <div id="layer"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript>Для работы приложения нужен JavaScript.</noscript>
</body>
</html>
